const dimSel = document.getElementById("dim"), valSel = document.getElementById("val"), busca = document.getElementById("busca");
const nuvem = document.getElementById("nuvem"), info = document.getElementById("info");
const LIMITE = 250;
function opcoes(){
  dimSel.innerHTML = "<option value=''>Todos os comentarios</option>" +
    Object.keys(DADOS.dims).map(d => `<option value="${d}">${d}</option>`).join("");
}
function atualizaValores(){
  const d = dimSel.value;
  valSel.innerHTML = d ? DADOS.dims[d].map(v => `<option value="${v}">${v}</option>`).join("") : "";
  valSel.style.display = d ? "" : "none";
}
function desenha(){
  const d = dimSel.value, v = valSel.value, q = busca.value.trim().toLowerCase();
  let lista = DADOS.bigramas.map(b => {
    const n = d ? (b.dims[d + ":" + v] || 0) : b.total;
    return {bg: b.bigrama, n};
  }).filter(x => x.n > 0 && (!q || x.bg.includes(q)));
  lista.sort((a, b) => b.n - a.n);
  lista = lista.slice(0, LIMITE);
  const max = lista.length ? lista[0].n : 1, min = lista.length ? lista[lista.length - 1].n : 0;
  nuvem.innerHTML = "";
  for (const x of lista){
    const f = max === min ? 1 : (x.n - min) / (max - min);
    const s = document.createElement("span");
    s.textContent = x.bg;
    s.style.fontSize = (12 + f * 26).toFixed(1) + "px";
    s.title = x.bg + ": " + x.n + " comentarios";
    nuvem.appendChild(s);
  }
  info.textContent = lista.length + " bigramas mostrados" + (d ? " em " + d + " = " + (v || "") : "");
}
opcoes(); atualizaValores(); desenha();
dimSel.addEventListener("change", () => { atualizaValores(); desenha(); });
valSel.addEventListener("change", desenha);
busca.addEventListener("input", desenha);
</script></body></html>
